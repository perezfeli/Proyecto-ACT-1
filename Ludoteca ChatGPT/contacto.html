<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ludoteca: reseñas y reglamentos de juegos de mesa.">
  <title>Contacto | Ludoteca</title>
  <link rel="stylesheet" href="estilosIA.css">
</head>
<body>

<header>
  <div class="navbar">
    <a class="logo" href="index.html">Ludoteca</a>
    <nav aria-label="Navegación principal">
      <ul>
        <li><a href="contacto.html">Contacto</a></li>
        <li><a href="acerca.html">Quién mantiene el sitio</a></li>
        <li><a href="catalogo.html">Catálogo</a></li>
      </ul>
    </nav>
  </div>
</header>

<main>

<section class="page-heading">
  <h1>Contacto</h1>
  <p>¿Tenés una sugerencia para la ludoteca? Dejanos un mensaje.</p>
</section>
<form action="#" method="post">
  <div class="form-group">
    <label for="nombre">Nombre</label>
    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
  </div>
  <div class="form-group">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="nombre@ejemplo.com" required>
  </div>
  <div class="form-group">
    <label for="asunto">Asunto</label>
    <input type="text" id="asunto" name="asunto" placeholder="¿Sobre qué querés escribir?">
  </div>
  <div class="form-group">
    <label for="mensaje">Mensaje</label>
    <textarea id="mensaje" name="mensaje" placeholder="Escribí tu mensaje..." required></textarea>
  </div>
  <button class="btn" type="submit">Enviar mensaje</button>
</form>

</main>

<footer>
  <p><strong>Ludoteca</strong> · Reseñas de juegos de mesa</p>
  <p>Sitio estático realizado únicamente con HTML y CSS.</p>
</footer>

</body>
</html>
