<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto — Ludoteca El Dado Feliz</title>
  <link rel="stylesheet" href="estilosIA.css">
</head>
<body>

  <header class="site-header">
    <div class="logo">🎲 Ludoteca El Dado Feliz</div>
    <nav>
      <ul>
        <li><a href="catalogo.html">Catálogo</a></li>
        <li><a href="acerca.html">Quiénes somos</a></li>
        <li><a href="contacto.html" class="activo">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Contacto</h1>
    <p class="subtitulo">¿Consultas, sugerencias de juegos o querés reservar uno? Escribinos.</p>

    <form class="form-contacto" action="#" method="post">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre" placeholder="Tu nombre y apellido" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="tuemail@ejemplo.com" required>

      <label for="mensaje">Mensaje</label>
      <textarea id="mensaje" name="mensaje" placeholder="Contanos en qué te podemos ayudar" required></textarea>

      <button type="submit">Enviar mensaje</button>
    </form>
  </main>

  <footer class="site-footer">
    <p>© 2026 Ludoteca El Dado Feliz — La Plata, Buenos Aires</p>
  </footer>

</body>
</html>
